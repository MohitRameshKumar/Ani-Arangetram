<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Layāñjali</title>
  <meta name="description" content="Photos from years of mridangam training and rehearsal ahead of Ani's arangetram.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f3e9d8' stroke='%23b08d3e' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23241912'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&amp;family=Literata:ital,wght@0,400;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body data-page="gallery">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="section container">
      <span class="eyebrow">Years in the making</span>
      <h1>Gallery</h1>
      <p>Lessons, rehearsals, and the ordinary hours that led to tonight. Select any photo to view it larger.</p>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox__close" id="lightbox-close"><span class="visually-hidden">Close</span><span aria-hidden="true">&times;</span></button>
    <button class="lightbox__prev" id="lightbox-prev"><span class="visually-hidden">Previous photo</span><span aria-hidden="true">&larr;</span></button>
    <button class="lightbox__next" id="lightbox-next"><span class="visually-hidden">Next photo</span><span aria-hidden="true">&rarr;</span></button>
    <div>
      <img id="lightbox-image" src="" alt="" width="800" height="600">
      <p class="lightbox__caption" id="lightbox-caption"></p>
    </div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/content.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
